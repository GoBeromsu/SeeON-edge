# 소스 빌드 개발 오버레이 — compose.edge.yaml 위에 얹어서 쓴다.
#
# 왜 필요한가: GHCR publish 워크플로("Edge ML Images")가 현재 13/13 연속으로
# push 에 403 실패 중이다 — 두 이미지(ml-api, ml-worker) 패키지가 v1 저장소
# (SeniorAILab/eldercare-fall-ml) 소유로 남아 있어서, v2에서 도는 워크플로의
# GITHUB_TOKEN 이 push 권한이 없다 (자세한 내용/두 가지 수정안은 #237 참고).
# 그 결과 최근 main 커밋 중 GHCR 에 이미지가 존재하는 게 하나도 없고,
# compose.edge.yaml 은 `build: !reset null` 로 pull 전용이라 소스 빌드 경로가
# 없다. 이 오버레이는 GHCR 이 복구될 때까지 이 노드를 소스에서 직접 빌드해
# 띄우기 위한 임시 경로다 — #237 이 고쳐지면 다시 compose.edge.yaml 단독(+
# GPU/CPU 오버레이) 경로로 되돌아간다.
#
#   docker compose --env-file .env.edge.prod -f compose.edge.yaml -f compose.edge.dev.yaml -f compose.edge.cpu.yaml up -d --build
#
# 세 번째 -f 는 필수다: 이 노드는 NVIDIA 드라이버가 없는 CPU 전용 호스트라서,
# compose.edge.yaml 의 무조건적 GPU deploy 예약을 compose.edge.cpu.yaml 이
# 지워야 컨테이너 생성이 성공한다 (compose.edge.cpu.yaml 헤더 참고). --build
# 는 로컬에 같은 태그의 이미지가 이미 있어도 매번 다시 빌드하게 강제한다 —
# 없으면 두 번째 `up` 부터는 소스가 바뀌어도 캐시된 이미지를 그대로 쓴다.
#
# 검증된 동작 (추측이 아니라 `docker compose -f ... -f ... -f ... config` 로
# 직접 확인함): compose.edge.yaml 의
#   image: ${ML_API_IMAGE:?ML_API_IMAGE is required in edge prod}
#   image: ${ML_WORKER_IMAGE:?ML_WORKER_IMAGE is required in edge prod}
# 는 그 파일 자신을 보간(interpolate)하는 시점에 평가된다. 이 시점은 이
# 오버레이의 build: 가 병합되기 *전*이다 — 그래서 ML_API_IMAGE/ML_WORKER_IMAGE
# 가 비어 있으면, 이 오버레이를 얹고 build: 를 정의해 둬도 여전히
# "required variable ML_API_IMAGE is missing a value" 로 죽는다. 오버레이의
# build: 하나만으로는 base 파일의 `:?` 체크를 우회할 수 없다.
#
# 따라서 .env.edge.prod 에 아래 두 값을 로컬 빌드 태그로 채워야 한다 (다른
# 필수 변수 — CLIP_STORE_HOST_DIR, API_DASHBOARD_USERNAME/PASSWORD,
# ML_WORKER_PROFILE 등 — 는 그대로 필요하다 (API_EDGE_RELAY_TOKEN 은 compose
# 기본값, facility/cameras 는 대시보드 DB). 이 오버레이가 건드리는 건 이미지
# 두 개뿐이다):
#
#   ML_API_IMAGE=eldercare-fall-ml-api:dev
#   ML_WORKER_IMAGE=eldercare-fall-ml-worker:dev
#
# 이렇게 하면 병합된 서비스가 image:(태그, base 에서 옴)와 build:(빌드 방법,
# 이 오버레이에서 옴)를 동시에 갖는다 — `docker compose up --build` 가 로컬
# 소스로 빌드해서 정확히 그 태그로 태깅하고, GHCR 은 전혀 건드리지 않는다.
#
# pull_policy: never 는 필수다 — 없으면 compose 가 위 dev 태그를 레지스트리에서
# 당겨오려다 (존재하지 않으므로) 실패할 수 있다.
#
# 실서비스 배포 경로(GHCR pull + NVIDIA GPU, compose.edge.yaml 단독)는 이
# 파일과 무관하며 손대지 않는다 — 그 경로는 깨진 게 아니라 지금 당장 publish
# 가 안 될 뿐이다.
services:
  ml-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        VITE_ML_API_BASE_URL: /api/v1
    pull_policy: never
  ml-worker:
    build:
      context: .
      dockerfile: Dockerfile.edge

    pull_policy: never
  # Same locally built worker tag; never try to pull it from GHCR.
  edge-model-fetch:
    pull_policy: never
