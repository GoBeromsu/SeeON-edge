name: Release

# Cutting a release is pushing an annotated tag `seeon-edge-v<semver>`. That
# push is the whole trigger: this workflow guards the tag against the tree,
# composes the notes, and creates the GitHub Release itself. A human never
# clicks "Draft a new release" -- doing so would skip the carrier guard below.
#
# Publishing the images: `.github/workflows/edge-images.yml` builds and pushes
# `ml-api` and `ml-worker` to GHCR at the full commit SHA and uploads the
# `edge-ml-image-refs-<sha>` artifact holding both `@sha256:` digests. It has an
# `on: release: types: [published]` trigger, but THAT TRIGGER DOES NOT FIRE FOR
# A RELEASE THIS WORKFLOW CREATES, and the first release proved it: a release
# created with the default GITHUB_TOKEN raises no event that starts another run.
# GitHub's rule, verbatim: "With the exception of `workflow_dispatch` and
# `repository_dispatch`, other `GITHUB_TOKEN`-triggered events do not create
# workflow runs at all."
#
# So the release job dispatches edge-images.yml explicitly, using the one
# documented exception. The `release:` trigger stays where it is -- it still
# fires for a release published by a human or a PAT -- and edge-images.yml's
# `concurrency` group keys on the tag, so the explicit dispatch and a
# hypothetical `release:` run of the same tag cannot both build.
#
# The release must still NOT be a prerelease: edge-images.yml is gated on
# `github.event.release.prerelease == false`, and a prerelease also reads to
# every operator as "do not deploy this".
#
# `workflow_dispatch` runs the same pipeline as a REHEARSAL: the guard and the
# notes really run, and the release is not created. It is the way to find out
# that a carrier is out of step before a tag exists to be deleted.
#
# This workflow is not reachable from `pull_request`, so it is outside the
# closed-world policy tests/test_public_repository_privacy.py enforces on
# ci.yml and edge-images.yml. Every `uses:` is pinned to a full 40-hex commit
# SHA anyway: the policy is what this repository does, not only what a test can
# currently see, and adding a `pull_request` trigger here later must not
# silently introduce an unpinned action.

on:
  push:
    tags:
      - "seeon-edge-v*"
  workflow_dispatch:
    inputs:
      rehearsal:
        description: "Rehearsal run: guard the carriers and compose the notes, create no GitHub Release"
        required: false
        default: true
        type: boolean

# Workflow-wide default. `contents: write` is granted to the single job that
# creates the release, so any job added to this file later starts read-only.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Guard the tag against every version carrier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Every version carrier agrees with the tag
        id: guard
        # On a tag push the tag is compared against the tree. On a rehearsal
        # there is no tag, so only carrier lockstep is checked and the expected
        # tag is printed -- which is exactly what an operator needs before
        # tagging. `scripts/release_guard.py` names every carrier and explains
        # why EDGE_DATABASE_FORMAT_IDENTITY is not one of them.
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            python3 scripts/release_guard.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/release_guard.py
          fi
          # Assigned first so `set -e` catches a failure here, rather than
          # letting a command substitution fail inside an `echo` argument.
          EXPECTED_TAG="$(python3 scripts/release_guard.py --print-expected-tag)"
          echo "expected-tag=$EXPECTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Compose the release notes
        # Run on every path, rehearsal included: a rehearsal that skipped this
        # would not prove the notes compose. A rehearsal uses the tag the tree
        # expects, so it composes exactly what the real release would.
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || steps.guard.outputs.expected-tag }}
        run: |
          set -euo pipefail
          python3 scripts/release_notes.py --tag "$TAG" --head HEAD > release-notes.md
          {
            printf '### Release notes for `%s`\n\n' "$TAG"
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create the GitHub Release
    needs: guard
    # A rehearsal stops here, and so does any dispatch that is not sitting on a
    # release tag. Only a `seeon-edge-v*` tag push reaches `gh release create`.
    if: github.ref_type == 'tag' && inputs.rehearsal != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # `contents: write` creates the release; `actions: write` dispatches
      # edge-images.yml, which is the only way the images get published (see
      # the GITHUB_TOKEN rule in the header).
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#seeon-edge-v}"
          python3 scripts/release_notes.py --tag "$TAG" > release-notes.md
          # Idempotent: a re-run of a release that already exists is a no-op
          # rather than a failure. `--verify-tag` refuses to invent a tag that
          # is not in the repository. No `--prerelease`, deliberately -- see the
          # header: a prerelease would publish no images.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; leaving it alone"
            exit 0
          fi
          gh release create "$TAG" \
            --title "SeeON Edge v$VERSION" \
            --notes-file release-notes.md \
            --verify-tag \
            --latest

      - name: Publish the edge images for this tag
        # Not belt-and-braces: this is the ONLY thing that publishes them. The
        # `release: published` trigger on edge-images.yml never fires for the
        # release created above, because GITHUB_TOKEN-raised events do not start
        # workflow runs -- `workflow_dispatch` is one of the two documented
        # exceptions, which is exactly what this step uses.
        #
        # Dispatched on the tag, so edge-images.yml runs the workflow file as it
        # exists in the released commit and checks out that same commit
        # (`DEPLOY_REF` is `inputs.ref`). The images are therefore built from the
        # sealed SHA, never from whatever main has drifted to.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh workflow run edge-images.yml --ref "$TAG" -f ref="$TAG"
          echo "Dispatched edge-images.yml for $TAG. Both digest-pinned refs land in"
          echo "the run's step summary and in the edge-ml-image-refs-<sha> artifact."
