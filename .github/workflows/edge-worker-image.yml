name: Edge Worker Image

# Builds the real ml-worker image (Dockerfile.edge, the slim
# `--no-default-groups --group worker` path) on every PR and on every push to
# main, then boots it and asserts the worker process actually imports and
# starts config resolution. edge-images.yml never runs on pull_request (only
# release/workflow_dispatch), so without this job a runtime dependency
# missing from the `worker` uv group ships straight to main undetected --
# see #195.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: edge-worker-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-boot-smoke:
    name: Build ml-worker + boot smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ml-worker image (Dockerfile.edge)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.edge
          load: true
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          tags: eldercare-fall-ml-worker:ci
          # Same cache scope as edge-images.yml's ml-worker build so PR runs
          # and release publishes warm each other's layer cache instead of
          # each starting cold on the CUDA wheel layer.
          cache-from: type=gha,scope=edge-ml-worker
          cache-to: type=gha,scope=edge-ml-worker,mode=max

      - name: Boot smoke test — worker process actually imports and starts
        # A successful build only proves the image assembles; it does not
        # prove the interpreter can import the worker's module graph (the
        # httpx incident: image built fine, container died at boot with
        # ModuleNotFoundError). `--check-config` is the entrypoint's own
        # no-side-effect boot path (worker/runtime/AGENTS.md) -- it forces
        # every top-level import in worker/__main__.py's module graph to
        # resolve before returning, without a relay pull or any disk write.
        # RELAY_URL/RELAY_TOKEN only need to be well-formed, not reachable.
        run: |
          docker run --rm \
            -e RELAY_URL=http://relay.invalid \
            -e RELAY_TOKEN=ci-boot-smoke-test \
            eldercare-fall-ml-worker:ci \
            python -m worker --check-config

      - name: Packaged clip consistency maintenance CLI smoke
        run: |
          docker run --rm \
            eldercare-fall-ml-worker:ci \
            python scripts/repair_clip_consistency.py --help
