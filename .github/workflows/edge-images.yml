name: Edge ML Images

# Single build path for the two edge images:
#
#   Dockerfile.backend -> ml-api    (front + backend; also the one-shot
#                                    migrator/consistency services)
#   Dockerfile.edge    -> ml-worker (DeepStream runtime)
#
# Models are NOT baked into either image (scripts/fetch-models.sh owns that).
#
# Every pull_request and every push to main builds BOTH images once and boots
# the worker (`--check-config`), which is what actually catches a broken image
# (the httpx incident in #195: the image built fine and died at boot). This
# replaces the separate edge-worker-image.yml gate, which built Dockerfile.edge
# a second time with its own cache scope.
#
# The boot smoke has two shapes, and exactly one runs per image build:
#
#   freshly built, not a release -> load the docker-format carrier and run it
#     with networking disabled. This is every pull_request and every push to
#     main.
#   reused, or a release build   -> pull the published digest and `docker run`
#     it, so the seal never carries a worker digest that was not booted in this
#     run. Rare, and already logged in to the registry.
#
# The fresh-build carrier is written by BuildKit and loaded only for its smoke.
# It keeps boot verification outside the shipped Dockerfile while ensuring the
# exact locally built image is what starts.
#
# Publish policy:
#   pull_request     -> build + boot smoke only. Never pushes, never logs in.
#   push to main     -> also pushes the staging tag `main-<short-sha>` (plus
#                       the full-SHA tag) and writes the BuildKit cache, so
#                       PR builds hit a cache refreshed on every merge instead
#                       of only on release (#365 had release as the sole
#                       cache writer).
#   release          -> pushes the full-SHA tag and the release tag for the
#   workflow_dispatch   sealed SHA; this is the path
#                       docs/runbooks/edge-image-publish.md pins.
#
# ---------------------------------------------------------------------------
# Per-image release isolation
# ---------------------------------------------------------------------------
#
# A release is ONE version whose artefact is a manifest pinning BOTH images by
# `@sha256:` -- the seal. Isolation is not about versioning; it is about not
# rebuilding an image whose inputs did not move.
#
# It cannot be about reproducibility. Both Dockerfiles take `SOURCE_REVISION`
# and stamp `org.opencontainers.image.revision`, so rebuilding an UNCHANGED tree
# at a new commit still yields a NEW digest. So isolation comes from not
# building at all: when an image's inputs are unchanged since the commit that
# built the currently published digest, that digest is given the new release's
# tags (`docker buildx imagetools create`, which copies the manifest rather than
# rebuilding) and re-emitted unchanged into the seal.
#
# The comparison base is NOT the previous release's commit. It is the commit
# that actually built the digest being reused, read back from that image's own
# `org.opencontainers.image.revision` label. Those differ as soon as an image is
# reused twice, and using the release commit would skip everything that changed
# in between. scripts/edge_image_plan.py owns the whole decision, including
# every "then build" fallback; tests/test_edge_image_isolation.py owns the
# input sets and proves them against both Dockerfiles' COPY instructions.
#
# Only a run that is PUBLISHING A RELEASE reuses -- which is not the same as
# the `release` event. release.yml dispatches this workflow on the release tag,
# because a release it creates with GITHUB_TOKEN raises no event that starts a
# run (#460). So `RELEASE_BUILD` below counts both shapes: the `release` event,
# and a dispatch whose ref is a `seeon-edge-v*` tag. A pull_request must
# exercise real builds (that is the gate, and it is also what catches drift in
# the floating apt packages Dockerfile.edge installs); a push to main is the
# BuildKit cache writer (#365); and a dispatch on any other ref stays the
# deliberate "rebuild this ref" escape hatch. The decision is made INSIDE the
# job and printed on every run, including the runs that do not reuse -- see the
# hard constraint below.
#
# Every run exposes both image digests as job outputs and in the step
# summary so operators pin `@sha256:` (runbook rule); pushing runs also
# upload the `edge-ml-image-refs-<sha>.env` artifact the runbook consumes,
# which states per image whether it was built or reused, and from where.
#
# No `merge_group:` trigger, deliberately. This repository has no merge queue
# enabled, and adding the trigger here would not be harmless: PUSH_IMAGES is
# `github.event_name != 'pull_request'`, so a queued batch would log in, push
# `main-<sha>` tags for a commit that may never land, and write the BuildKit
# cache. If a merge queue is ever enabled, `merge_group` must be added here
# (the required `Build edge ML images + boot smoke` check would otherwise never
# report for a batch and the queue would stall) AND PUSH_IMAGES must be
# narrowed to exclude it.
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (tag, branch, or SHA)
        required: true
        default: main

concurrency:
  group: edge-ml-images-${{ github.event.release.tag_name || inputs.ref || github.event.pull_request.number || github.ref }}
  # Superseded PR pushes are cancelled; release/dispatch/main runs are not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Workflow-wide default. `packages: write` is NOT granted here: it is attached
# to the single job that publishes, so any job added to this file later starts
# read-only instead of inheriting a registry write scope.
permissions:
  contents: read

jobs:
  publish:
    name: Build edge ML images + boot smoke
    # Prereleases never publish (unchanged); PR / main / dispatch always run.
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    # `permissions:` accepts no expression (GitHub community discussion
    # #53915), so this grant cannot be narrowed to the pushing events by
    # syntax. Nor can the job be split behind an `if:`: this is the REQUIRED
    # `Build edge ML images + boot smoke` status check, and a skipped job is
    # scored as green by branch protection -- a mis-gated `if:` would turn the
    # gate into a silent pass, which is the exact failure mode `ci-ok` exists
    # to prevent. The boundary is enforced on the token's consumers instead:
    # every step that can spend it -- registry login, both `push:` inputs, both
    # `cache-to` exports, both digest re-tags and the artifact upload -- is
    # gated on PUSH_IMAGES, which is exactly
    # `github.event_name != 'pull_request'`. That gate is asserted step by step
    # in tests/test_public_repository_privacy.py, which also fails if any other
    # job in this file gains a write scope.
    #
    # The same reasoning is why per-image isolation is decided INSIDE this job
    # rather than with `paths:` filters or an `if:` on the job: a required check
    # that does not report is a required check that passes. The job always runs,
    # always reports, and prints which images it decided to build.
    #
    # On a fork pull request GitHub caps GITHUB_TOKEN at read-only whatever
    # this block says, so the grant is only ever live for same-repo branch PRs.
    permissions:
      contents: read
      packages: write
    # Writing the mode=max cache for the multi-gigabyte DeepStream layers is
    # slower than the build itself, so only the pushing paths (which export
    # cache) get the long budget; PRs stay on the boot-smoke gate budget.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 25 || 60 }}
    env:
      DEPLOY_REF: ${{ github.event.release.tag_name || inputs.ref || github.sha }}
      IMAGE_NAMESPACE: ghcr.io/seniorailab/eldercare-fall-ml
      # PRs never push. Everything else (main push, release, dispatch) does.
      PUSH_IMAGES: ${{ github.event_name != 'pull_request' }}
      # "This run is publishing a release." That is NOT the same as the
      # `release` event. A release created by release.yml with the default
      # GITHUB_TOKEN raises no event that starts a workflow run (GitHub's rule,
      # quoted in release.yml's header; the first release proved it), so
      # release.yml dispatches this workflow on the tag instead. Keying reuse on
      # `github.event_name == 'release'` alone would therefore never once be
      # true in practice, and the isolation would silently never engage.
      #
      # Both shapes count: the `release` event (still real for a release a human
      # or a PAT publishes) and a dispatch whose ref is a release tag.
      RELEASE_TAG: >-
        ${{ github.event.release.tag_name
            || (startsWith(inputs.ref, 'seeon-edge-v') && inputs.ref)
            || '' }}
      RELEASE_BUILD: >-
        ${{ github.event_name == 'release'
            || (github.event_name == 'workflow_dispatch'
                && startsWith(inputs.ref, 'seeon-edge-v')) }}
    outputs:
      ml-api-digest: ${{ steps.digests.outputs.ml-api }}
      ml-worker-digest: ${{ steps.digests.outputs.ml-worker }}
      ml-api-origin: ${{ steps.digests.outputs.ml-api-origin }}
      ml-worker-origin: ${{ steps.digests.outputs.ml-worker-origin }}
      deploy-sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.DEPLOY_REF }}
          # Full history AND tags: the isolation decision diffs against the
          # commit that built the published image, and finds the previous
          # release by walking `seeon-edge-v*` tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve deploy SHA and image tags
        id: resolve
        # Tag scheme:
        #   always      <full 40-hex sha>           (what the seal pins)
        #   main push   main-<12-char short sha>    (staging tag for operators
        #                                            trying a pre-release build)
        #   release     <release tag>               (so the NEXT release can find
        #                                            this one's digest in the
        #                                            registry and decide whether
        #                                            it still applies)
        # PR tags exist only in the runner's daemon (never pushed).
        run: |
          set -euo pipefail
          DEPLOY_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          for image in ml-api ml-worker; do
            tags="$IMAGE_NAMESPACE/$image:$DEPLOY_SHA"
            if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              tags="$tags,$IMAGE_NAMESPACE/$image:main-$SHORT_SHA"
            fi
            if [ -n "$RELEASE_TAG" ]; then
              tags="$tags,$IMAGE_NAMESPACE/$image:$RELEASE_TAG"
            fi
            var="$(printf '%s' "$image" | tr 'a-z-' 'A-Z_')_TAGS"
            echo "$var=$tags" >> "$GITHUB_ENV"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GitHub Container Registry
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Decide, per image, whether to build or reuse
        # This step ALWAYS runs and always prints its verdict for both images,
        # on every event including pull_request. Deciding here rather than with
        # `paths:` filters is deliberate: a `paths:`-filtered required check
        # never reports, and branch protection scores a check that never
        # reports as green.
        run: |
          set -euo pipefail
          for image in ml-api ml-worker; do
            var="BUILD_$(printf '%s' "$image" | tr 'a-z-' 'A-Z_')"
            if python3 scripts/edge_image_plan.py plan \
                 --image "$image" \
                 --head "$DEPLOY_SHA" \
                 --release-tag "${RELEASE_TAG:-none}" \
                 --repo "$IMAGE_NAMESPACE/$image" \
                 --reuse-eligible "$RELEASE_BUILD" \
                 --json-out "plan-$image.json" \
                 | tee "plan-$image.txt"; then
              build="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["build"])' "plan-$image.json")"
            else
              # A decision that could not be made is not a reason to skip a
              # build; it is a reason to build.
              printf '%s: BUILD -- the planner failed, so nothing is reused\n' "$image" \
                | tee "plan-$image.txt"
              printf '{"image": "%s", "build": true, "reason": "the planner failed"}\n' "$image" \
                > "plan-$image.json"
              build=True
            fi
            if [ "$build" = "True" ]; then
              echo "$var=true" >> "$GITHUB_ENV"
            else
              echo "$var=false" >> "$GITHUB_ENV"
            fi
          done
          {
            printf '### Per-image build plan (`%s`)\n\n```\n' "$GITHUB_EVENT_NAME"
            cat plan-ml-api.txt plan-ml-worker.txt
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push ml-api image
        id: build-api
        if: env.BUILD_ML_API == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.backend
          push: ${{ env.PUSH_IMAGES == 'true' }}
          # An OCI index (attestation attached) is what lets a later release
          # re-tag this digest without changing it: `imagetools create` copies
          # an index byte for byte, but re-wraps a plain manifest in a NEW index
          # under a new digest. Verified against a real registry, both ways.
          provenance: true
          build-args: |
            VITE_ML_API_BASE_URL=/api/v1
            SOURCE_REVISION=${{ env.DEPLOY_SHA }}
          tags: ${{ env.ML_API_TAGS }}
          cache-from: type=gha,scope=edge-ml-api
          cache-to: ${{ env.PUSH_IMAGES == 'true' && 'type=gha,scope=edge-ml-api,mode=max' || '' }}

      - name: Build and push ml-worker image
        id: build-worker
        if: env.BUILD_ML_WORKER == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.edge
          # A release still pushes an OCI index rather than a plain manifest: a
          # release's digest is the one a LATER release may reuse, and
          # re-tagging only preserves a digest when the manifest is an index,
          # which means attaching provenance.
          push: ${{ env.PUSH_IMAGES == 'true' }}
          provenance: ${{ env.RELEASE_BUILD == 'true' }}
          outputs: type=docker,dest=/tmp/ml-worker-runtime.tar
          build-args: |
            SOURCE_REVISION=${{ env.DEPLOY_SHA }}
          tags: ${{ env.ML_WORKER_TAGS }}
          cache-from: type=gha,scope=edge-ml-worker
          # PRs consume the cache and never export it. The reason is cost, not
          # trust. A fork PR's cache cannot poison a later run on main. GitHub's
          # cache docs are explicit: "When a cache is created by a workflow run
          # triggered on a pull request, the cache is created for the merge ref
          # (refs/pull/.../merge). Because of this, the cache will have a
          # limited scope and can only be restored by re-runs of the pull
          # request. It cannot be restored by the base branch or other pull
          # requests targeting that base branch." The same page's low-trust
          # section adds: "The pull_request event is not affected."
          # (docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching)
          #
          # What the export does cost is measured: `#37 exporting to GitHub
          # Actions Cache` took 413.3s (4.8s preparing + 408.6s sending) on push
          # run 33154567502, and it buys the run that paid it exactly nothing --
          # a cache entry only ever helps the NEXT run. On top of that this
          # repository's Actions cache is already past its 10 GB limit (10.7 GiB
          # measured), so an extra mode=max export mostly evicts DeepStream
          # blobs that later runs then rebuild. main/release/dispatch are the
          # cache writers.
          cache-to: ${{ env.PUSH_IMAGES == 'true' && 'type=gha,scope=edge-ml-worker,mode=max' || '' }}

      - name: Boot smoke test — freshly built ml-worker image actually boots
        if: env.BUILD_ML_WORKER == 'true' && env.RELEASE_BUILD != 'true'
        run: |
          set -euo pipefail
          docker load --input /tmp/ml-worker-runtime.tar
          set +e
          docker run --rm --network none \
            -e RELAY_TOKEN=ci-boot-smoke-test \
            "$IMAGE_NAMESPACE/ml-worker:$DEPLOY_SHA" \
            python -m worker --check-config
          status=$?
          set -e
          test "$status" -eq 0

      - name: Re-tag the published ml-api digest
        # Token-spending: adds a tag in the registry. Gated on PUSH_IMAGES like
        # every other consumer of the token. Reachable only when the step above
        # was skipped because ml-api's inputs did not change.
        if: env.PUSH_IMAGES == 'true' && env.BUILD_ML_API != 'true'
        run: |
          set -euo pipefail
          digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["previous_digest"])' plan-ml-api.json)"
          for tag in "$DEPLOY_SHA" ${RELEASE_TAG:+"$RELEASE_TAG"}; do
            python3 scripts/edge_image_plan.py retag \
              --repo "$IMAGE_NAMESPACE/ml-api" --digest "$digest" --tag "$tag"
          done

      - name: Re-tag the published ml-worker digest
        if: env.PUSH_IMAGES == 'true' && env.BUILD_ML_WORKER != 'true'
        run: |
          set -euo pipefail
          digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["previous_digest"])' plan-ml-worker.json)"
          for tag in "$DEPLOY_SHA" ${RELEASE_TAG:+"$RELEASE_TAG"}; do
            python3 scripts/edge_image_plan.py retag \
              --repo "$IMAGE_NAMESPACE/ml-worker" --digest "$digest" --tag "$tag"
          done

      - name: Resolve the digests this release pins
        id: digests
        # One place decides what goes in the seal, whether the digest came from
        # a build or from a re-tag. A reused digest MUST equal the digest the
        # previous release published -- `retag` re-inspects the registry and
        # fails if `imagetools create` changed it, so by here they are equal.
        env:
          BUILT_ML_API: ${{ steps.build-api.outputs.digest }}
          BUILT_ML_WORKER: ${{ steps.build-worker.outputs.digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os

          outputs, environment = [], []
          for image in ("ml-api", "ml-worker"):
              var = image.replace("-", "_").upper()
              plan = json.load(open(f"plan-{image}.json"))
              built = os.environ.get(f"BUILT_{var}", "")
              previous = plan.get("previous_digest") or ""
              if plan["build"]:
                  if not built:
                      # A pull request build has no exporter for ml-api (no
                      # push, no load), so buildx reports no digest -- expected,
                      # and there is nothing pullable to name. On a publishing
                      # run the same emptiness is a real failure, and used to be
                      # written into the artifact as `ml-api@` with no digest.
                      if os.environ.get("PUSH_IMAGES") == "true":
                          raise SystemExit(f"{image} was built but exported no digest")
                      digest, action = "(not exported on a pull request build)", "built"
                      origin = f"built from {os.environ['DEPLOY_SHA']}, not exported"
                  else:
                      digest, action = built, "built"
                      origin = f"built from {os.environ['DEPLOY_SHA']}"
              else:
                  if not previous:
                      raise SystemExit(f"{image} was reused but no published digest was recorded")
                  # Reuse republishes the SAME manifest; `retag` already
                  # re-inspected the registry and failed if buildx changed it,
                  # so this digest is byte-identical to the previous release's.
                  digest, action = previous, "reused"
                  origin = (
                      f"reused from {plan['previous_tag']} "
                      f"(originally built from {plan['base'][:12]})"
                  )
              outputs += [f"{image}={digest}", f"{image}-origin={origin}"]
              environment += [
                  f"{var}_DIGEST={digest}",
                  f"{var}_ORIGIN={origin}",
                  f"{var}_ACTION={action}",
                  f"{var}_PREVIOUS={previous or '(none)'}",
              ]

          for name, lines in (("GITHUB_OUTPUT", outputs), ("GITHUB_ENV", environment)):
              with open(os.environ[name], "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
          print("\n".join(outputs))
          PY

      - name: Boot smoke test — published ml-worker digest actually boots
        # A successful build only proves the image assembles; it does not prove
        # the interpreter can import the worker's module graph (the httpx
        # incident: image built fine, container died at boot with
        # ModuleNotFoundError). `--check-config` is the entrypoint's own
        # no-side-effect boot path (worker/runtime/AGENTS.md) -- it forces every
        # top-level import in worker/__main__.py's module graph to resolve
        # before returning, without a relay pull or any disk write. The relay
        # URL is fixed in-code now (RELAY_URL is retired); only RELAY_TOKEN is
        # required and it only needs to be well-formed, not reachable.
        #
        # The complement of the carrier smoke above: this is the path where
        # there is no fresh local build graph to smoke, because ml-worker was
        # either REUSED from a previous release or built on a release (which
        # pushes an OCI index and loads nothing). Both cases pull the exact
        # bytes this run pins, which is the stronger evidence for a seal: it
        # boots what was actually published, not merely what was built.
        #
        # Both branches here are registry reads on a run that is already logged
        # in -- reuse is a release-time decision (scripts/edge_image_plan.py
        # refuses reuse unless `--reuse-eligible true`), so a pull request never
        # reaches this step.
        if: env.BUILD_ML_WORKER != 'true' || env.RELEASE_BUILD == 'true'
        run: |
          set -euo pipefail
          SMOKE_REF="$IMAGE_NAMESPACE/ml-worker@$ML_WORKER_DIGEST"
          docker pull "$SMOKE_REF"
          echo "boot smoke target: $SMOKE_REF"
          docker run --rm \
            -e RELAY_TOKEN=ci-boot-smoke-test \
            "$SMOKE_REF" \
            python -m worker --check-config

      - name: Write edge image env artifact
        run: |
          set -euo pipefail
          {
            printf 'ML_API_IMAGE=%s/ml-api@%s\n' "$IMAGE_NAMESPACE" "$ML_API_DIGEST"
            printf 'ML_WORKER_IMAGE=%s/ml-worker@%s\n' "$IMAGE_NAMESPACE" "$ML_WORKER_DIGEST"
            # Per image: built or reused, and from where. An operator comparing
            # this file with the previous release's can see which half moved
            # without diffing digests by eye.
            printf '# ml-api: %s [%s]; previous release digest %s\n' \
              "$ML_API_ORIGIN" "$ML_API_ACTION" "$ML_API_PREVIOUS"
            printf '# ml-worker: %s [%s]; previous release digest %s\n' \
              "$ML_WORKER_ORIGIN" "$ML_WORKER_ACTION" "$ML_WORKER_PREVIOUS"
          } > edge-ml-image-refs.env
          {
            printf '### Edge ML image refs (%s, `%s`)\n\n' "$GITHUB_EVENT_NAME" "$DEPLOY_SHA"
            printf '| image | action | this release | previous release | origin |\n'
            printf '|---|---|---|---|---|\n'
            printf '| `ml-api` | **%s** | `%s` | `%s` | %s |\n' \
              "$ML_API_ACTION" "$ML_API_DIGEST" "$ML_API_PREVIOUS" "$ML_API_ORIGIN"
            printf '| `ml-worker` | **%s** | `%s` | `%s` | %s |\n\n' \
              "$ML_WORKER_ACTION" "$ML_WORKER_DIGEST" "$ML_WORKER_PREVIOUS" "$ML_WORKER_ORIGIN"
            printf 'A `reused` row shows the same digest in both digest columns: that is the proof it is the same artefact, not a rebuild.\n\n'
            if [ "$PUSH_IMAGES" = "true" ]; then
              printf 'Pushed tags:\n\n```\n%s\n%s\n```\n\n' "$ML_API_TAGS" "$ML_WORKER_TAGS"
              printf 'Use these digest-pinned refs in `.env.edge.prod` on the edge device:\n\n'
            else
              printf 'Pull request build: nothing was pushed. Digests below are the local build result only.\n\n'
            fi
            printf '```dotenv\n'
            cat edge-ml-image-refs.env
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload edge image refs
        # Only pushed digests are resolvable from a registry; a PR artifact
        # would invite pinning a digest nothing can pull.
        if: env.PUSH_IMAGES == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edge-ml-image-refs-${{ env.DEPLOY_SHA }}
          path: edge-ml-image-refs.env
          if-no-files-found: error
