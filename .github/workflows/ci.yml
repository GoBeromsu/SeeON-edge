name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Scan tracked tree for secrets
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo:ro"
          zricethezav/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          detect --source=/repo --no-git --redact --exit-code=1

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.27"
          enable-cache: false

      - name: Install FFmpeg test dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: uv sync --frozen --group lint

      - name: Fetch packaged default LSTM model
        run: bash scripts/fetch-models.sh

      # `integration` is deselected here because that is what the marker has
      # always claimed in pyproject.toml ("excluded from the default CI suite")
      # while this command never actually excluded it. The one test carrying it
      # (test_cloud_edge_provisioning_integration.py) drives a *live* enrolled
      # ml-api over CLOUD_EDGE_ML_URL against a real catalog sqlite file, so on
      # a runner it can only fail with "CLOUD_EDGE_ML_URL is required" -- and it
      # has been failing on main for exactly that reason. It is not `real_stack`
      # (that marker means external RTSP tooling on PATH, which this needs none
      # of), so the marker is right and the filter was wrong.
      - run: uv run pytest -q -m "not real_stack and not heavy and not integration"
      - run: uv run --group lint ruff check .
      # Stage 0 guardrail: declarative architecture contracts (import-linter).
      # Tightened per strangler stage; replaces test_import_dependency_ladder.py at Stage 5.
      - run: uv run --group lint lint-imports

      # Facility identity (facility id / facility token) and the camera roster
      # must never be provisionable through the environment: an env var reaches
      # the runtime via compose, and compose is tracked in Git. `--fixture`
      # proves the scanner still detects residue; `--repo` scans this tree.
      # Before `--repo` existed the scan was only reachable behind
      # --plan/--evidence (a plan file plus 17 evidence files), so it never ran
      # in CI and residue survived in compose.edge.yaml despite matching.
      - name: Scope fidelity (no env-provisioned identity or camera roster)
        run: |
          uv run python scripts/verify_scope_fidelity.py --fixture
          uv run python scripts/verify_scope_fidelity.py --repo

      # #179/#182: the shipped example must render on its own -- every
      # compose.edge.yaml `${VAR:?...}` needs a value (default or
      # placeholder) in .env.edge.prod.example, or an operator following the
      # docs gets stuck at `docker compose config`. This only checks render
      # success, not placeholder content (the example intentionally still
      # has <placeholder> values -- scripts/edge-preflight/check-env.sh is
      # what an operator runs against their filled-in .env.edge.prod).
      - name: Edge env example renders (GPU + CPU-only overlay)
        run: |
          docker compose --env-file .env.edge.prod.example \
            -f compose.edge.yaml -f compose.edge.cpu.yaml config -q
