name: CI

# A PR used to trigger this workflow twice: once for `push` (the PR branch) and
# once for `pull_request`, on the identical commit. Restricting `push` to main
# leaves exactly one run per PR plus one post-merge run on main, halving CI
# compute without losing a single check.
#
# No `merge_group:` trigger: this repository has no merge queue enabled, and
# adding the trigger would make every queued batch run the full suite again
# (`ci-ok` is already required on the PR). If a merge queue is ever turned on,
# `merge_group` MUST be added here or the required `ci-ok` check will never
# report for a queued batch and the queue will stall.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; main runs are never cancelled so the
  # default branch keeps an unbroken status history.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Needs no uv, no apt, no models -- only the checked-out tree and docker.
  secrets:
    runs-on: ubuntu-latest
    # Reads the tree and runs one container; a run that outlives this is hung.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Scan tracked tree for secrets
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo:ro"
          zricethezav/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          detect --source=/repo --no-git --redact --exit-code=1

  # Static checks only. Deliberately carries no ffmpeg/fonts-noto-cjk apt step
  # and no model fetch: ruff, import-linter, verify_scope_fidelity.py and
  # `docker compose config` read the repo tree and nothing else, so the ~28s apt
  # install and the model download buy this job nothing.
  lint:
    runs-on: ubuntu-latest
    # uv sync + four static checks; measured well under 3 minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.27"
          # Deliberately disabled, not an oversight: ci.yml runs on
          # `pull_request` and therefore executes untrusted fork code, and the
          # GitHub Actions cache is shared across branches (see aa5e2c0 and
          # tests/test_public_repository_privacy.py). The measured cost of
          # leaving it off is ~21s of `uv sync` per job.
          enable-cache: false

      - run: uv sync --frozen --group lint

      - run: uv run --group lint ruff check .

      # Stage 0 guardrail: declarative architecture contracts (import-linter).
      # Tightened per strangler stage; replaces test_import_dependency_ladder.py at Stage 5.
      - run: uv run --group lint lint-imports

      # Facility identity (facility id / facility token) and the camera roster
      # must never be provisionable through the environment: an env var reaches
      # the runtime via compose, and compose is tracked in Git. `--fixture`
      # proves the scanner still detects residue; `--repo` scans this tree.
      - name: Scope fidelity (no env-provisioned identity or camera roster)
        run: |
          uv run python scripts/verify_scope_fidelity.py --fixture
          uv run python scripts/verify_scope_fidelity.py --repo

      # #179/#182: the shipped example must render on its own -- every
      # compose.edge.yaml `${VAR:?...}` needs a value (default or placeholder)
      # in .env.edge.prod.example, or an operator following the docs gets stuck
      # at `docker compose config`.
      - name: Edge env example renders (GPU + CPU-only overlay)
        run: |
          docker compose --env-file .env.edge.prod.example \
            -f compose.edge.yaml -f compose.edge.cpu.yaml config -q

  # The whole cost centre: pytest was 18m27s of a 19m37s job. Sharded across
  # SHARD_TOTAL runners by test file, which needs no new dependency in uv.lock.
  test:
    runs-on: ubuntu-latest
    # A shard is ~5 minutes of the 4-way split; 30 bounds a wedged shard
    # without tripping on a slow runner.
    timeout-minutes: 30
    strategy:
      # One shard's failure must not hide the others' results.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARD_TOTAL: "4"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.27"
          enable-cache: false

      # ffmpeg drives the clip recorder's H.264 encode path; fonts-noto-cjk
      # provisions the same real CJK glyph file the runtime image installs
      # (Dockerfile.edge -> /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc).
      # The overlay renderer fails closed via OverlayFontUnavailable when no real
      # CJK font is discoverable, so the CJK render tests can only pass once the
      # runner carries the packaged font -- exactly as production does.
      - name: Install FFmpeg and packaged CJK overlay font
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk

      - run: uv sync --frozen --group lint

      # ~900KB, measured at 1s on a runner. Deliberately not wrapped in
      # actions/cache: this workflow runs untrusted fork code and the Actions
      # cache is cross-branch, so caching model weights here is a supply-chain
      # vector (aa5e2c0) bought for roughly zero seconds.
      - name: Fetch packaged default LSTM model
        run: bash scripts/fetch-models.sh

      # The marker filter is unchanged. `integration` is deselected because that
      # is what the marker has always claimed in pyproject.toml; its one test
      # drives a live enrolled ml-api over CLOUD_EDGE_ML_URL and can only fail on
      # a runner. `heavy` is wall-clock supervision that is flaky on a loaded
      # runner; `real_stack` needs external RTSP tooling on PATH.
      #
      # Sharding is a deterministic round-robin over the sorted tracked test
      # files. It adds no dependency to uv.lock (pytest-split/pytest-xdist would),
      # is stable across runs, and `ci-ok` fails if any shard collects nothing.
      #
      # File discovery mirrors pytest's own `python_files` default
      # (`test_*.py` and `*_test.py`, at any depth) rather than the narrower
      # `tests/test_*.py` this shard started with: the old pathspec silently
      # dropped `tests/foo_test.py` and `tests/unit/test_x.py` out of EVERY
      # shard while `ci-ok` stayed green. The equality of this partition with
      # the tracked tree is asserted in tests/test_public_repository_privacy.py
      # (test_shard_partition_is_an_exact_cover_of_the_suite), so the two
      # definitions cannot drift apart unnoticed.
      #
      # `${{ matrix.shard }}` is passed through `env:` instead of being
      # interpolated into the script body: expression interpolation splices
      # text into the shell source before bash ever parses it, and `$SHARD`
      # is a value the shell reads rather than code it compiles.
      - name: Run test shard ${{ matrix.shard }} of 4
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t shard_files < <(
            git ls-files -- '*.py' |
              grep -E '(^|/)(test_[^/]*|[^/]*_test)\.py$' |
              # A CTest fixture, not a pytest module: CMakeLists.txt runs it as
              # `python perception_wire_cross_language_test.py <binary>`. It
              # matches pytest's default glob but defines no test function, so
              # pytest collects zero tests from it.
              grep -vxF 'worker/native/deepstream/src/perception_wire_cross_language_test.py' |
              LC_ALL=C sort |
              awk -v shard="$SHARD" -v total="$SHARD_TOTAL" \
                'NR % total == shard % total'
          )
          if [ "${#shard_files[@]}" -eq 0 ]; then
            echo "shard $SHARD collected no test files" >&2
            exit 1
          fi
          echo "shard $SHARD/$SHARD_TOTAL: ${#shard_files[@]} files"
          uv run pytest -q -m "not real_stack and not heavy and not integration" \
            "${shard_files[@]}"

  # Single required status check for branch protection. Every dependency's
  # result is asserted explicitly: `needs` alone would let a skipped or
  # cancelled job pass silently under `if: always()`.
  ci-ok:
    runs-on: ubuntu-latest
    # Reads `needs` results and exits; it does no work of its own.
    timeout-minutes: 5
    needs: [secrets, lint, test]
    if: always()
    steps:
      - name: Assert every required job succeeded
        run: |
          failed=0
          for entry in \
            "secrets=${{ needs.secrets.result }}" \
            "lint=${{ needs.lint.result }}" \
            "test=${{ needs.test.result }}"; do
            name="${entry%%=*}"
            result="${entry#*=}"
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"
