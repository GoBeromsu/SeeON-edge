# Edge device stack — runs on the external edge node, NOT on the host stack.
# The edge performs ML inference locally. ml-worker relays alert/heartbeat facts
# to local ml-api over the compose network, and ml-api is the only process that
# pushes backend Event API requests over the public network.
# Edge target is a linux/amd64 PC with an NVIDIA RTX-class GPU; images are
# pulled from GHCR only (pinned tag or digest) — no on-site builds.
#
# Usage (on the edge device):
#   docker compose --env-file .env.edge.prod -f compose.edge.yaml up -d
#
services:
  ml-api:
    image: ${ML_API_IMAGE:?ML_API_IMAGE is required in edge prod}
    build: !reset null
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ML_SERVING_PORT:-8000}:8000"
    environment:
      # 주소는 패키징 시점에 여기서 굽고 시설 ID·토큰은 등록 API가 SQLite에 저장한다.
      # events_url/config_url are derived from this at runtime (`{base}/v1/events`,
      # `{base}/v1/ml-config`); API_BACKEND_EVENTS_URL/API_BACKEND_CONFIG_URL still
      # work as per-field overrides if a deployment ever needs to diverge from the
      # single base host.
      # iwinv Hub, reached over the public internet. Plain host, no `/api`
      # suffix and no trailing slash — store._normalize_api_base() appends
      # `/api`, so events resolve to `{base}/api/v1/events`.
      # http:// is deliberate for this rollout: TLS is a separate follow-up, so
      # this hop is unencrypted. Tailscale is the operator SSH/deploy channel
      # only and is never the data path.
      API_BACKEND_BASE_URL: ${API_BACKEND_BASE_URL:-http://49.247.204.81}
      # 코드 기본값 0.5s는 LAN 릴레이 기준이라 공인망에서는 토폴로지 스냅샷
      # PUT(업로드 + Hub 트랜잭션 처리)이 매번 타임아웃된다. 이벤트 인제스트와
      # 스냅샷 업로드가 같은 타임아웃을 공유하므로 공인망 여유치로 올린다.
      API_BACKEND_INGEST_TIMEOUT_SEC: ${API_BACKEND_INGEST_TIMEOUT_SEC:-10}
      # The bearer token ml-api sends to the backend Event API (issue #552) is
      # deliberately absent here. Facility identity — facility code and the
      # single-use enrollment token — is typed into the Edge dashboard and
      # stored in the connection_settings SQLite volume. Never provision it
      # through the environment or Git.
      # Internal worker↔ml-api pairing secret. Baked default — not a site secret.
      # Override only if you deliberately rotate the internal pair on both sides.
      API_EDGE_RELAY_TOKEN: ${API_EDGE_RELAY_TOKEN:-eldercare-internal-edge-relay}
      API_DASHBOARD_USERNAME: ${API_DASHBOARD_USERNAME:?edge api requires dashboard username}
      API_DASHBOARD_PASSWORD: ${API_DASHBOARD_PASSWORD:?edge api requires dashboard password}
      # Facility id + cameras are dashboard/DB only (connection_settings +
      # camera_registry). Do not provision API_FACILITY_ID or API_CAMERA_INVENTORY.
      ML_API_WORKER_STREAM_ORIGIN: http://ml-worker:${ML_WORKER_DEV_MJPEG_PORT:-8090}
      ML_API_WORKER_PROBE_ORIGIN: http://ml-worker:${ML_WORKER_DEV_MJPEG_PORT:-8090}
      # Fixed container path of the evidence clip store (host bind below).
      CLIP_STORE_DIR: /var/lib/clip-store
      # 연결 설정 sqlite의 컨테이너 경로. 아래 ml-api-state 볼륨 안이어야
      # 한다 — 코드 기본값 /var/lib/ml-api/는 볼륨이 아니라서, 그대로 두면
      # 기사님이 대시보드에서 저장한 연결 설정이 컨테이너 재생성 때 사라진다.
      API_CONNECTION_SETTINGS_PATH: /root/.local/state/ml-api/connection-settings.sqlite3
      # 클립 라벨/감사로그 저장 경로. 코드 기본값(resolve_state_dir("ml-api"))도
      # 이제 같은 볼륨 아래로 떨어지지만, 연결 설정과 같은 이유로 명시해 둔다 —
      # 기본값이 바뀌어도 이 컨테이너의 라벨·감사로그가 볼륨 밖으로 새지 않게.
      API_LABEL_STORE: /root/.local/state/ml-api/labels
      # Facility-wide processed FPS for live camera streams (unset -> worker 5.0
      # default). Raise (e.g. 15) to smooth the live wall where GPU headroom allows.
      ML_DEFAULT_CAMERA_FPS: ${ML_DEFAULT_CAMERA_FPS:-}
      # Facility-wide detection cadence divisor (unset -> worker stride-1
      # default: detect every frame). Raise alongside ML_DEFAULT_CAMERA_FPS to
      # keep detection cadence bounded while live view runs faster on
      # inference-bound hardware.
      ML_DEFAULT_FRAME_STRIDE: ${ML_DEFAULT_FRAME_STRIDE:-}
      # IANA tz for locally-configured detection windows (see
      # cameras/router.py's _resolved_tz): applies only when the backend has
      # no externally-pulled window for the domain to inherit a tz from.
      # Unset -> UTC, which silently shifts an intended night window to the
      # wrong hours for any non-UTC facility (issue #206). Every edge
      # deployment should set this to the facility's real tz.
      ML_API_DETECTION_TZ: ${ML_API_DETECTION_TZ:-UTC}
    volumes:
      - ${ML_MODELS_DIR:-./models}:/app/models:ro
      - ml-api-state:/root/.local/state/ml-api
      # Evidence clips persist on the nursing-home host; worker writes, api reads.
      - ${CLIP_STORE_HOST_DIR:?edge requires host clip-store dir}:/var/lib/clip-store:ro
    command:
      - uvicorn
      - backend.app.main:app
      - --host
      # Container-internal bind only; host publishing above is loopback-only.
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3

  ml-worker:
    image: ${ML_WORKER_IMAGE:?ML_WORKER_IMAGE is required in edge prod}
    build: !reset null
    pull_policy: always
    restart: unless-stopped
    # GPU inference: reserve the host NVIDIA GPU (requires NVIDIA Container Toolkit).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      # This explicit allowlist is the complete persistent worker environment
      # contract. Do not forward the host environment wholesale or persist
      # one-shot operator/test activation gates in this service.
      # Camera roster is pull-only. worker/__main__.py pulls the live config
      # from ml-api over RELAY_URL/RELAY_TOKEN below, with the worker's own
      # last-known-good cache as fallback on a pull failure. There is
      # deliberately no env or YAML roster override here: the camera list is
      # owned by the Edge camera_registry DB (dashboard-entered), never by
      # environment or Git. Use `--config` on a developer machine if you need
      # a static roster; production has no such path.
      RELAY_URL: http://ml-api:8000
      # Same baked default as ml-api API_EDGE_RELAY_TOKEN (internal pair only).
      RELAY_TOKEN: ${API_EDGE_RELAY_TOKEN:-eldercare-internal-edge-relay}
      ML_WORKER_PROFILE: ${ML_WORKER_PROFILE:?set cuda|mps|cpu|igpu}
      ML_WORKER_DEV_MJPEG: ${ML_WORKER_DEV_MJPEG:-true}
      ML_WORKER_DEV_MJPEG_HOST: 0.0.0.0
      ML_WORKER_DEV_MJPEG_PORT: ${ML_WORKER_DEV_MJPEG_PORT:-8090}
      # models.fall/clip.enabled are locally-sourced (issues #66/#68): the
      # pull-only topology above has no local YAML to carry them, and the
      # backend pull only ever carries fleet-level
      # state (relay/domains/cameras), so these two are edge-local env vars
      # instead, mounted from the same ML_MODELS_DIR volume as ml-api above.
      ML_WORKER_FALL_MODEL_ARTIFACT_DIR: ${ML_WORKER_FALL_MODEL_ARTIFACT_DIR:-/app/models/fall/lstm}
      ML_WORKER_FALL_MODEL_WINDOW: ${ML_WORKER_FALL_MODEL_WINDOW:-30}
      ML_WORKER_FALL_MODEL_STRIDE: ${ML_WORKER_FALL_MODEL_STRIDE:-5}
      ML_WORKER_FALL_MODEL_OPERATING_THRESHOLD: ${ML_WORKER_FALL_MODEL_OPERATING_THRESHOLD:-0.5}
      ML_WORKER_FALL_MODEL_SCHEMA_VERSION: ${ML_WORKER_FALL_MODEL_SCHEMA_VERSION:-1}
      ML_WORKER_FALL_MODEL_PREPROCESSING_IDENTITY: ${ML_WORKER_FALL_MODEL_PREPROCESSING_IDENTITY:-legacy-coco17-xyc-frame-normalized-zero-fill-v1}
      # Evidence clip recording stays off by default -- see the clip.enabled
      # doc in worker/ml-worker.example.yaml. Export is controlled at runtime
      # from the authenticated Edge dashboard and does not gate event delivery.
      ML_WORKER_CLIP_RECORDING_ENABLED: ${ML_WORKER_CLIP_RECORDING_ENABLED:-false}
      # Fixed container path of the evidence clip store (host bind below).
      CLIP_STORE_DIR: /var/lib/clip-store
      # NVENC clip encoding needs the `video` driver capability in addition to
      # the compute/utility default granted by the GPU reservation above.
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    volumes:
      - ${ML_MODELS_DIR:-./models}:/app/models:ro
      - ml-worker-state:/root/.local/state/ml-worker
      # Evidence clips persist on the nursing-home host; worker writes, api reads.
      - ${CLIP_STORE_HOST_DIR:?edge requires host clip-store dir}:/var/lib/clip-store:rw
    depends_on:
      ml-api:
        condition: service_healthy
    command:
      - python
      - -m
      - worker
      - --heartbeat-on-start

volumes:
  ml-api-state: {}
  ml-worker-state: {}
