# Edge device stack — runs on the external edge node, NOT on the host stack.
# The edge performs ML inference locally. ml-worker relays facts to ml-api over
# the private Compose network; ml-api is the only public-backend client.
#
# Usage (choose exactly one infrastructure overlay):
#   CPU/Apple MPS: -f compose.edge.yaml
#   NVIDIA:        -f compose.edge.yaml -f compose.edge.nvidia.yaml
#   Intel VAAPI:   -f compose.edge.yaml -f compose.edge.igpu.yaml

# The project name is REQUIRED, never defaulted. Compose would otherwise derive
# it from the directory name, and this host already carries three similarly
# named state volumes -- `edge_edge-state`, `seeon-edge-wt-alert-api_edge-state`
# and `seeon-prod-edge-state`. Running from a checkout named `SeeON-edge` would
# silently bind `seeon-edge_edge-state`, an empty volume, so a cutover would
# migrate a fresh database while the live one sat untouched and the operator saw
# a clean success. Failing closed here makes that impossible.
name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required so the stack binds the intended edge-state volume}

services:
  edge-filesystem-inventory:
    image: ${ML_API_IMAGE:?ML_API_IMAGE is required in edge prod}
    build: !reset null
    pull_policy: always
    restart: "no"
    volumes:
      - edge-state:/var/lib/seeon-state:ro
      - worker-local-state:/var/lib/seeon-worker-state:ro
      - ${CLIP_STORE_HOST_DIR:?edge requires host clip-store dir}:/var/lib/clip-store:ro
    command:
      - python
      - -m
      - backend.app.edge_db.inventory

  # One-shot operator tool. The worker image has no scripts/ops and the backend
  # image has no writable worker-state mount, so without this service the
  # documented requeue command cannot be run anywhere -- a gate the operator
  # cannot clear. Never started by the stack; invoked explicitly with
  # `docker compose run --rm edge-refused-evidence [--requeue]`.
  edge-refused-evidence:
    image: ${ML_API_IMAGE:?ML_API_IMAGE is required in edge prod}
    build: !reset null
    pull_policy: always
    restart: "no"
    profiles: ["ops"]
    volumes:
      - worker-local-state:/var/lib/seeon-state
    entrypoint:
      - python
      - scripts/ops/review-refused-evidence.py
      - --state-dir
      - /var/lib/seeon-state

  edge-db-migrator:
    image: ${ML_API_IMAGE:?ML_API_IMAGE is required in edge prod}
    build: !reset null
    pull_policy: always
    restart: "no"
    depends_on:
      edge-filesystem-inventory:
        condition: service_completed_successfully
    volumes:
      - edge-state:/var/lib/seeon-state
      - worker-local-state:/var/lib/seeon-worker-state:ro
      - ${CLIP_STORE_HOST_DIR:?edge requires host clip-store dir}:/var/lib/clip-store:ro
      # Released state volumes remain rollback evidence and are writable only
      # before cutover. The migrator checkpoints/backs them up, then reads them.
      - ml-api-state:/var/lib/legacy-api-state
      - ml-worker-state:/var/lib/legacy-worker-state
    command:
      - python
      - -m
      - backend.app.edge_db.compact_cutover
      - --source
      - /var/lib/seeon-state/edge.sqlite3
      - --live
      - /var/lib/seeon-state/edge.sqlite3
      - --archive
      - /var/lib/seeon-state/edge-v17-archive.sqlite3
      - --candidate
      - /var/lib/seeon-state/edge-v18-candidate.sqlite3
      - --receipt
      - /var/lib/seeon-state/schema18-cutover-receipts.jsonl
      - --clip-store
      - /var/lib/clip-store
      - --worker-state
      - /var/lib/seeon-worker-state

  ml-api:
    image: ${ML_API_IMAGE:?ML_API_IMAGE is required in edge prod}
    build: !reset null
    pull_policy: always
    restart: unless-stopped
    ports:
      # The serving port and loopback-only exposure are fixed topology.
      - "127.0.0.1:8000:8000"
    environment:
      # Public deployment boundary. Specific events/config URL overrides are
      # retired; both endpoints derive from this one base URL. Must be https://
      # (no cleartext public IP fallback). Local fixtures may use loopback http
      # or API_BACKEND_ALLOW_INSECURE_HTTP=1 (never set here).
      API_BACKEND_BASE_URL: ${API_BACKEND_BASE_URL:?edge api requires HTTPS hub base URL}
      # Public internet ingest timeout. The production default remains 10s.
      API_BACKEND_INGEST_TIMEOUT_SEC: ${API_BACKEND_INGEST_TIMEOUT_SEC:-10}
      # One secret paired with worker RELAY_TOKEN below. No built-in default:
      # supply a deployment-unique random value. Preflight rejects the known
      # sample and weak/placeholder values.
      API_EDGE_RELAY_TOKEN: ${API_EDGE_RELAY_TOKEN:?edge api requires a deployment-unique relay token}
      # Deployment-provided bootstrap only — no built-in admin/admin authority.
      # Preflight rejects the known default pair; use a random password per site.
      API_DASHBOARD_USERNAME: ${API_DASHBOARD_USERNAME:?edge api requires dashboard username}
      API_DASHBOARD_PASSWORD: ${API_DASHBOARD_PASSWORD:?edge api requires dashboard password}
      # RTSP destination policy (shared with worker). Facility LAN cameras need
      # PRIVATE=1. LOCAL is fixture-only and must stay 0 in production.
      ML_RTSP_ALLOW_PRIVATE_DESTINATIONS: ${ML_RTSP_ALLOW_PRIVATE_DESTINATIONS:-0}
      ML_RTSP_ALLOW_LOCAL_DESTINATIONS: ${ML_RTSP_ALLOW_LOCAL_DESTINATIONS:-0}
      # Facility identity/token and camera roster are intentionally absent:
      # dashboard enrollment + camera_registry are their only authorities.
    volumes:
      # Fixed image-adjacent model root; model selection/policy comes from the
      # versioned worker config, never from environment variables.
      - ./models:/app/models:ro
      - edge-state:/var/lib/seeon-state
      - ${CLIP_STORE_HOST_DIR:?edge requires host clip-store dir}:/var/lib/clip-store:ro
    depends_on:
      edge-db-migrator:
        condition: service_completed_successfully
    command:
      - uvicorn
      - backend.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3

  ml-worker:
    image: ${ML_WORKER_IMAGE:?ML_WORKER_IMAGE is required in edge prod}
    build: !reset null
    pull_policy: always
    restart: unless-stopped
    environment:
      # This explicit allowlist is the complete persistent worker environment
      # contract. Do not forward the host environment wholesale or persist
      # one-shot operator/test activation gates in this service.
      # The relay origin, MJPEG bind/origin/port, model paths, and state paths
      # are baked runtime topology. Only the paired secret, profile alias, and
      # RTSP destination policy flags cross the deployment boundary. Live clip
      # export is a dashboard runtime setting and is never projected here.
      RELAY_TOKEN: ${API_EDGE_RELAY_TOKEN:?edge worker requires a deployment-unique relay token}
      ML_WORKER_PROFILE: ${ML_WORKER_PROFILE:?set cpu-host|nvidia|intel-vaapi-host|apple-mps-host (legacy cpu|igpu|mps accepted)}
      # Same RTSP destination policy as ml-api (worker probe path).
      ML_RTSP_ALLOW_PRIVATE_DESTINATIONS: ${ML_RTSP_ALLOW_PRIVATE_DESTINATIONS:-0}
      ML_RTSP_ALLOW_LOCAL_DESTINATIONS: ${ML_RTSP_ALLOW_LOCAL_DESTINATIONS:-0}
      # Facility identity/token, camera roster, model/domain/clip policy, and
      # static YAML config are intentionally absent. The versioned config
      # endpoint backed by dashboard/DB state owns those values.
    volumes:
      - ./models:/app/models:ro
      - worker-local-state:/var/lib/seeon-state
      - ${CLIP_STORE_HOST_DIR:?edge requires host clip-store dir}:/var/lib/clip-store:rw
    depends_on:
      ml-api:
        condition: service_healthy
    command:
      - python
      - -m
      - worker
      - --heartbeat-on-start
      # REQUIRED in a container. The default resolves under the user's home,
      # which here is the writable layer, so the durable delivery queue would be
      # destroyed on every container replacement and the pre-v17 filesystem gate
      # would read an empty volume and wave the cutover through.
      - --state-dir
      - /var/lib/seeon-state

volumes:
  edge-state: {}
  worker-local-state: {}
  # Read-only rollback boundary for the one-time import; runtimes never mount these.
  ml-api-state: {}
  ml-worker-state: {}
