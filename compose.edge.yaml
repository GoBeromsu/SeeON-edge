# Edge device stack — runs on the external edge node, NOT on the host stack.
# The edge performs ML inference locally. ml-worker relays facts to ml-api over
# the private Compose network; ml-api is the only public-backend client.
#
# Usage:
#   NVIDIA DeepStream Flow: -f compose.edge.yaml -f compose.edge.nvidia.yaml

# The project name is REQUIRED, never defaulted. Compose would otherwise derive
# it from the directory name, and this host already carries three similarly
# named state volumes -- `edge_edge-state`, `seeon-edge-wt-alert-api_edge-state`
# and `seeon-prod-edge-state`. Running from a checkout named `SeeON-edge` would
# silently bind `seeon-edge_edge-state`, an empty volume, and likewise a fresh
# PostgreSQL volume, so provisioning would build a new empty database while the
# live one sat untouched and the operator saw a clean success. Failing closed
# here makes that impossible.
name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required so the stack binds the intended edge-state volume}

services:
  # One-shot operator tool. The worker image has no scripts/ops and the backend
  # image has no writable worker-state mount, so without this service the
  # documented requeue command cannot be run anywhere -- a gate the operator
  # cannot clear. Never started by the stack; invoked explicitly with
  # `docker compose run --rm edge-refused-evidence [--requeue]`.
  edge-refused-evidence:
    image: ${ML_API_IMAGE:?ML_API_IMAGE is required in edge prod}
    build: !reset null
    pull_policy: always
    restart: "no"
    profiles: ["ops"]
    volumes:
      - worker-local-state:/var/lib/seeon-state
    entrypoint:
      - python
      - scripts/ops/review-refused-evidence.py
      - --state-dir
      - /var/lib/seeon-state

  # Edge product state. Pinned to the digest CI tests against. No `ports:`:
  # only services on the private Compose network reach it.
  postgres:
    image: postgres@sha256:9e73daeb439141c2b11eea2463f5f1a3b269fd90d897b41cddb7cb440f21aa5d
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      # The entrypoint reads the superuser password from the secret file; it is
      # never an environment value.
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
    secrets:
      - pg_superuser_password
    volumes:
      # The image keeps PGDATA under /var/lib/postgresql/<major>/docker.
      - edge-pgdata:/var/lib/postgresql
    healthcheck:
      # TCP, as in CI: the init-time server listens only on the unix socket, so a
      # socket probe could report ready before initialisation finishes.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot PostgreSQL provision. The first run creates the versioned schema,
  # the runtime role with the password from its DSN file, and the fenced
  # authority file; every later run verifies them and changes nothing. Besides
  # the ops cutover below it is the only service that holds the owner DSN.
  edge-db-migrator:
    image: ${ML_API_IMAGE:?ML_API_IMAGE is required in edge prod}
    build: !reset null
    pull_policy: always
    restart: "no"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    secrets:
      - pg_owner_dsn
      - pg_runtime_dsn
    volumes:
      - edge-pg-authority:/run/seeon-authority
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - python
      - -m
      - backend.app.edge_db.migration
      - provision
      - --owner-dsn-file
      - /run/secrets/pg_owner_dsn
      - --schema
      - seeon_edge
      - --runtime-dsn-file
      - /run/secrets/pg_runtime_dsn
      - --authority-file
      - /run/seeon-authority/authority.json

  # SQLite -> PostgreSQL cutover (docs/runbooks/postgresql-cutover.md). Never
  # started by the stack; each step is
  # `docker compose run --rm edge-db-cutover <subcommand> ...`. edge-state is
  # read-write because export takes the deployment lock beside the database.
  edge-db-cutover:
    image: ${ML_API_IMAGE:?ML_API_IMAGE is required in edge prod}
    build: !reset null
    pull_policy: always
    restart: "no"
    profiles: ["ops"]
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    secrets:
      - pg_owner_dsn
    volumes:
      - edge-state:/var/lib/seeon-state
      - worker-local-state:/var/lib/seeon-worker-state:ro
      - edge-migration:/var/lib/seeon-migration
      - edge-pg-authority:/run/seeon-authority
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - python
      - -m
      - backend.app.edge_db.migration

  ml-api:
    image: ${ML_API_IMAGE:?ML_API_IMAGE is required in edge prod}
    build: !reset null
    pull_policy: always
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      # The serving port and loopback-only exposure are fixed topology.
      - "127.0.0.1:8000:8000"
    environment:
      # Public deployment boundary. Specific events/config URL overrides are
      # retired; both endpoints derive from this one base URL. Must be https://
      # (no cleartext public IP fallback). Local fixtures may use loopback http
      # or API_BACKEND_ALLOW_INSECURE_HTTP=1 (never set here).
      API_BACKEND_BASE_URL: ${API_BACKEND_BASE_URL:?edge api requires HTTPS hub base URL}
      # Public internet ingest timeout. The production default remains 10s.
      API_BACKEND_INGEST_TIMEOUT_SEC: ${API_BACKEND_INGEST_TIMEOUT_SEC:-10}
      # One secret paired with worker RELAY_TOKEN below. No built-in default:
      # supply a deployment-unique random value. Preflight rejects the known
      # sample and weak/placeholder values.
      API_EDGE_RELAY_TOKEN: ${API_EDGE_RELAY_TOKEN:?edge api requires a deployment-unique relay token}
      # Deployment-provided bootstrap only — no built-in admin/admin authority.
      # Preflight rejects the known default pair; use a random password per site.
      API_DASHBOARD_USERNAME: ${API_DASHBOARD_USERNAME:?edge api requires dashboard username}
      API_DASHBOARD_PASSWORD: ${API_DASHBOARD_PASSWORD:?edge api requires dashboard password}
      # RTSP destination policy (shared with worker). Facility LAN cameras need
      # PRIVATE=1. LOCAL is fixture-only and must stay 0 in production.
      ML_RTSP_ALLOW_PRIVATE_DESTINATIONS: ${ML_RTSP_ALLOW_PRIVATE_DESTINATIONS:-0}
      # Execution-record diagnostics. OFF by default; when enabled the
      # budget is REQUIRED (no default) and the API refuses to boot without it.
      ML_API_EXECUTION_RECORDS_ENABLED: ${ML_API_EXECUTION_RECORDS_ENABLED:-0}
      ML_API_EXECUTION_RECORDS_BUDGET_BYTES: ${ML_API_EXECUTION_RECORDS_BUDGET_BYTES:-}
      ML_RTSP_ALLOW_LOCAL_DESTINATIONS: ${ML_RTSP_ALLOW_LOCAL_DESTINATIONS:-0}
      # Facility identity/token and camera roster are intentionally absent:
      # dashboard enrollment + camera_registry are their only authorities.
      # The runtime role's DSN; ml-api never receives the owner DSN.
      API_POSTGRES_DSN_FILE: /run/secrets/pg_runtime_dsn
      # Written by edge-db-migrator; only the ops cutover advances it.
      API_POSTGRES_AUTHORITY_FILE: /run/seeon-authority/authority.json
      # The schema edge-db-migrator provisions.
      API_POSTGRES_SCHEMA: seeon_edge
    secrets:
      - pg_runtime_dsn
    volumes:
      # No model mount: the backend never reads /app/models. Models are a
      # worker-owned artifact provisioned into the `worker-models` volume by
      # edge-model-fetch below.
      - edge-state:/var/lib/seeon-state
      - edge-pg-authority:/run/seeon-authority:ro
      - ${CLIP_STORE_HOST_DIR:?edge requires host clip-store dir}:/var/lib/clip-store:ro
    depends_on:
      edge-db-migrator:
        condition: service_completed_successfully
    command:
      - uvicorn
      - backend.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3

  # One-shot model provisioning, owned by the worker side. Models stay OUT of
  # the images: this service pulls every artifact listed in the committed
  # worker/tools/fetch_models/manifest.json from its pinned upstream (Hugging
  # Face revision / GitHub release tag), verifies size + SHA-256 of every
  # file, and lands them in the `worker-models` named volume. Idempotent --
  # a volume that already verifies is a no-op -- and it exits non-zero on any
  # mismatch, which holds ml-worker back via depends_on below. The existing API
  # image carries this isolated Python operator tool; the worker runtime does not.
  edge-model-fetch:
    image: ${ML_API_IMAGE:?ML_API_IMAGE is required in edge prod}
    build: !reset null
    pull_policy: always
    restart: "no"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      # Optional Hugging Face token for rate-limited or gated pulls. Sent to
      # Hugging Face sources only and never logged; leave empty for public.
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - worker-models:/models:rw
    command:
      - python
      - -m
      - worker.tools.fetch_models
      - --dest
      - /models

  # Engines are built after models arrive and before Flow source activation.
  # The worker verifies this cache at boot and never creates engines itself.
  # The ONNX must carry a dynamic batch axis; edge-engine-build refuses a fixed axis.
  edge-engine-build:
    image: ${ML_WORKER_IMAGE:?ML_WORKER_IMAGE is required in edge prod}
    build: !reset null
    pull_policy: always
    restart: "no"
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - worker-models:/app/models:ro
      - worker-engine-cache:/var/cache/seeon/tensorrt:rw
    depends_on:
      edge-model-fetch:
        condition: service_completed_successfully
    command:
      - /usr/local/bin/ml-worker
      - engine-build
      - --auxiliary-runtime=onnxruntime-cpu
      - --onnx=/app/models/pose/yolo26n-pose.onnx
      - --engine=/var/cache/seeon/tensorrt/yolo26n-pose-fp16.engine
      - --identity=/var/cache/seeon/tensorrt/engine-identity.json
      - --parser-lib=/opt/nvidia/deepstream/deepstream/lib/libnvdsinfer_custom_yolo26_pose.so
      - --infer-config=/opt/seeon/deepstream-flow/nvinfer-yolo26-pose.txt
      - --served-infer-config=/var/cache/seeon/tensorrt/nvinfer-yolo26-pose.txt
      - --tracker-config=/opt/seeon/deepstream-flow/${ML_WORKER_FLOW_TRACKER_PROFILE:-config_tracker_NvDCF_perf}.yml
      - --tracker-library=/opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
      - --bed-onnx=/app/models/bed/yolo26l-seg.onnx
      - --image-digest=${ML_WORKER_IMAGE:?ML_WORKER_IMAGE is required in edge prod}
      - --batch-size=${ML_WORKER_FLOW_BATCH_SIZE:?ML_WORKER_FLOW_BATCH_SIZE is required}

  ml-worker:
    image: ${ML_WORKER_IMAGE:?ML_WORKER_IMAGE is required in edge prod}
    build: !reset null
    pull_policy: always
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      RELAY_TOKEN: ${API_EDGE_RELAY_TOKEN:?edge worker requires a deployment-unique relay token}
      ML_WORKER_PROFILE: flow
      ML_WORKER_IMAGE: ${ML_WORKER_IMAGE:?ML_WORKER_IMAGE is required in edge prod}
      ML_WORKER_FLOW_INFER_CONFIG: /var/cache/seeon/tensorrt/nvinfer-yolo26-pose.txt
      ML_WORKER_FLOW_TRACKER_CONFIG: /opt/seeon/deepstream-flow/${ML_WORKER_FLOW_TRACKER_PROFILE:-config_tracker_NvDCF_perf}.yml
      ML_WORKER_FLOW_TRACKER_LIBRARY: /opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
      ML_WORKER_FLOW_RECORD_DIR: /var/lib/clip-store
      ML_WORKER_FLOW_RECORD_CACHE_SECONDS: "30"
      ML_WORKER_FLOW_RTSP_RECONNECT_INTERVAL_SEC: "5"
      ML_WORKER_FLOW_FRAME_WIDTH: "640"
      ML_WORKER_FLOW_FRAME_HEIGHT: "360"
      # Enable after the site soak.
      ML_WORKER_CLIP_ANALYSIS_CPU: ${ML_WORKER_CLIP_ANALYSIS_CPU:-}
      ML_WORKER_FLOW_BATCH_SIZE: ${ML_WORKER_FLOW_BATCH_SIZE:?ML_WORKER_FLOW_BATCH_SIZE is required}
      ML_WORKER_FLOW_ENGINE_PATH: /var/cache/seeon/tensorrt/yolo26n-pose-fp16.engine
      ML_WORKER_FLOW_ENGINE_IDENTITY_PATH: /var/cache/seeon/tensorrt/engine-identity.json
      ML_WORKER_FLOW_ONNX_PATH: /app/models/pose/yolo26n-pose.onnx
      ML_WORKER_FLOW_PARSER_LIBRARY: /opt/nvidia/deepstream/deepstream/lib/libnvdsinfer_custom_yolo26_pose.so
      ML_RTSP_ALLOW_PRIVATE_DESTINATIONS: ${ML_RTSP_ALLOW_PRIVATE_DESTINATIONS:-0}
      # Execution-record export (D0 bounded in-memory lanes). OFF by default; when
      # enabled all three sizes are REQUIRED (no defaults) and the worker refuses
      # to start without them or without the relay URL/token.
      ML_WORKER_EXECUTION_RECORDS_ENABLED: ${ML_WORKER_EXECUTION_RECORDS_ENABLED:-0}
      ML_WORKER_EXECUTION_RECORDS_LANE_CAPACITY: ${ML_WORKER_EXECUTION_RECORDS_LANE_CAPACITY:-}
      ML_WORKER_EXECUTION_RECORDS_BATCH_MAX: ${ML_WORKER_EXECUTION_RECORDS_BATCH_MAX:-}
      ML_WORKER_EXECUTION_RECORDS_FLUSH_MS: ${ML_WORKER_EXECUTION_RECORDS_FLUSH_MS:-}
      # Opt-in bounded replay-trace capture (rotating JSONL under the state volume);
      # empty disables it. Feeds scripts/qa/fall_model_recall_at_gate.py.
      WORKER_REPLAY_TRACE_DIR: ${WORKER_REPLAY_TRACE_DIR:-}
      ML_RTSP_ALLOW_LOCAL_DESTINATIONS: ${ML_RTSP_ALLOW_LOCAL_DESTINATIONS:-0}
    volumes:
      # Fixed image-adjacent model root, populated by edge-model-fetch.
      - worker-models:/models:ro
      # Deployment owns the fall-model selection, not the image: the read-only
      # selection mount lives in compose.edge.model-selection.yaml and is added
      # with `-f` only when a selection document exists on the host. Binding it
      # unconditionally made Docker create /deployment/model-selection.json as a
      # directory on a fresh host and the worker refused to boot (#498).
      # The deployed pose+bbox56 bundle is mounted read-only.
      - worker-models:/app/models:ro
      # Engines are prepared explicitly from the image-pinned manifest. Runtime
      # preflight verifies this writable cache and never writes beside models.
      - worker-engine-cache:/var/cache/seeon/tensorrt:rw
      - worker-local-state:/var/lib/seeon-state
      - ${CLIP_STORE_HOST_DIR:?edge requires host clip-store dir}:/var/lib/clip-store:rw
    depends_on:
      ml-api:
        condition: service_healthy
      edge-model-fetch:
        condition: service_completed_successfully
      edge-engine-build:
        condition: service_completed_successfully
    command:
      - /usr/local/bin/ml-worker
      - run
      - --auxiliary-runtime=onnxruntime-cpu
      - --heartbeat-on-start
      # REQUIRED in a container. The default resolves under the user's home,
      # which here is the writable layer, so the durable delivery queue would be
      # destroyed on every container replacement and the pre-v17 filesystem gate
      # would read an empty volume and wave the cutover through.
      - --state-dir
      - /var/lib/seeon-state

volumes:
  edge-state: {}
  worker-local-state: {}
  worker-engine-cache: {}
  # Pinned external model artifacts; written only by edge-model-fetch.
  worker-models: {}
  edge-pgdata: {}
  # The persistence authority file shared by the migrator, cutover and ml-api.
  edge-pg-authority: {}
  # Cutover snapshots and reconcile reports; they hold resident data.
  edge-migration: {}

# Host files, each owner-only (0600). Compose bind-mounts them read-only at
# /run/secrets/<name>; no value has a default.
secrets:
  pg_superuser_password:
    file: ${PG_SUPERUSER_PASSWORD_HOST_FILE:?edge requires the PostgreSQL superuser password file}
  # Superuser libpq DSN for provision and cutover; setting the runtime password
  # reads pg_authid, which needs a superuser.
  pg_owner_dsn:
    file: ${PG_OWNER_DSN_HOST_FILE:?edge requires the PostgreSQL owner DSN file}
  # libpq DSN for the runtime role, user seeon_edge_runtime.
  pg_runtime_dsn:
    file: ${PG_RUNTIME_DSN_HOST_FILE:?edge requires the PostgreSQL runtime DSN file}
