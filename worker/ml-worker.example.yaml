version: 1
relay:
  url: http://127.0.0.1:8000
  token: local-edge-relay-token
runtime:
  max_failures: 30
  open_timeout_ms: 5000
  read_timeout_ms: 5000
models:
  fall:
    # type selects the fall-model family via a registry keyed on this string
    # (worker.adapters.model.fall_family_registry), not a code-pinned class in
    # worker.py: a brand-new family (a different architecture, not a same-
    # family weights version-up) is added by implementing FallModelProtocol
    # and registering a factory under a new type value here -- an
    # unregistered value refuses to boot rather than silently using lstm.
    type: lstm
    framework: pytorch
    mode: sequence
    artifact_dir: ./models/fall/lstm
    weights: model.pt
    # architecture is the artifact's network-definition file (e.g. arch.json
    # for the lstm family), unrelated to the type/family selector above.
    architecture: arch.json
    metadata: metadata.yaml
    window: 30
    stride: 5
    input_shape: [30, 51]
    operating_threshold: 0.5
    schema_version: 1
    preprocessing_identity: legacy-coco17-xyc-frame-normalized-zero-fill-v1
domains:
  fall:
    enabled: true
  bed_exit:
    enabled: true
    night_window:
      start: "21:00"
      end: "05:00"
      tz: Asia/Seoul
# Evidence clip recording is on by default: this worker captures and retains
# short video clips around detected events, in addition to relaying the event
# itself. Set this to false only where clip capture is not an accepted
# operating decision. If the recorder fails to start, the worker keeps
# running without clips and the degraded state surfaces through runtime
# diagnostics (/status) instead of failing silently.
#
# Clip export is an independent persisted runtime setting in the Edge
# dashboard. It defaults OFF and never disables event delivery.
clip:
  enabled: true
cameras:
  - camera_id: camera-1
    facility_id: facility-1
    resident_id: resident-1
    rtsp_url: rtsp://camera-1.local/trackID=2
    heartbeat_interval_sec: 30
    frame_stride: 1
    label: Room 1
