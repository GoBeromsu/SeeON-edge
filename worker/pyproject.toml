# Workspace member: edge instance (RTSP inference worker). Heavy runtime deps.
[project]
name = "eldercare-worker"
version = "0.1.1"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pydantic>=2",
    "pyyaml>=6",
    "torch>=2.3",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "ultralytics>=8.3",
]

[tool.uv]
package = false
