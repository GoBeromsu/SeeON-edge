# CPU-only 엣지 오버레이 — compose.edge.yaml 위에 얹어서 쓴다.
#
#   docker compose -f compose.edge.yaml -f compose.edge.cpu.yaml up -d
#
# compose.edge.yaml 은 이제 GPU 중립이다. 이 호환 오버레이도 deploy 블록을
# 비워 두며, 워커 런타임은 CPU 를 정식 지원한다
# (ML_WORKER_PROFILE=cpu; worker/runtime/worker.py 의 _verify_cpu 는 CUDA
# 프로브를 조회하지 않는다).
#
# 함께 쓸 .env.edge.prod 설정:
#   ML_WORKER_PROFILE=cpu
# 그리고 카메라별 decode_backend 는 cpu 또는 opencv 로 둔다 — nvdec 는 GPU 를
# 요구하므로 이 경로에서는 쓸 수 없다.
#
# NVIDIA 호스트에서는 이 파일 대신 compose.edge.nvidia.yaml 을 얹는다.
services:
  ml-worker:
    # Base compose is host-only; no NVIDIA reservation or capability env exists.
    deploy: !reset null
