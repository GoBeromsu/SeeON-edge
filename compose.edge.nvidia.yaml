# NVIDIA infrastructure overlay. Required for ML_WORKER_PROFILE cuda,
# nvidia-host-bridge, or the explicit nvidia-device-experimental descriptor.
services:
  ml-worker:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
