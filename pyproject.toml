[project]
name = "ml"
version = "0.1.0"
description = "Fall/bed-exit ML: FastAPI backend + edge inference worker + React front. Training in eldercare-dataset-ops."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"

# Serving (online) dependencies — always-on path. Kept minimal for PoC.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "pydantic-settings>=2",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pyyaml>=6",
    # 런타임 의존성이다. streams_router 가 모듈 최상단에서 import 하므로
    # 슬림 백엔드 빌드(--no-default-groups)에도 반드시 들어가야 한다.
    "httpx>=0.27",
]

# Lifecycle separation: test/worker deps are isolated from the slim backend path.
[dependency-groups]
lint = [
    "import-linter>=2.13",
    "mypy>=1.11",
    "ruff==0.16.0",
]
test = [
    "pytest>=8.3",
]
worker = [
    "torch>=2.3",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "ultralytics>=8.3",
    "pillow>=12",
    "nvidia-ml-py>=12",
    "av>=15,<17",
    "onnx>=1.12,<2",
    "onnxruntime>=1.29.0",
    "onnxslim>=0.1.82",
]

[tool.uv]
package = false
# A bare `uv run` sees test+worker (edge runtime + tests). A slim backend build
# opts out via --no-default-groups.
default-groups = ["test", "worker"]
# Keep ultralytics from pulling the GUI OpenCV wheel alongside the repo-selected
# headless wheel; both distributions own cv2/ and corrupt clean uv installs.
override-dependencies = ["opencv-python ; sys_platform == 'never'"]

# GPU: pin torch/torchvision to the PyTorch CUDA wheel index so the worker gets a
# real CUDA build WITH Blackwell sm_120 kernels. In this environment only the
# cu130 index ships a torch (2.13.0) whose `torch.cuda.get_arch_list()` includes
# sm_120; the cu128 index's latest (2.11.0) has an empty arch_list. Two root
# causes were diagnosed (ADR-0002):
#  1. the default PyPI torch wheel had an empty arch_list (no GPU kernels) ->
#     `cuda.is_available()==False` -> silent CPU fallback (fixed by this pin);
#  2. SECOND, driver-level: NVIDIA driver 580.x + CUDA 13.0 fails `cuInit(0)` with
#     CUDA_ERROR_NO_DEVICE (a known-bad pairing). That is an OPS fix, not a torch
#     fix — align the host driver/CUDA to a validated pairing on the real edge
#     node (see ADR-0002 "Driver / CUDA pairing"). If ops standardizes on CUDA
#     12.x, repin to a cu12x wheel that also includes sm_120.
# `explicit = true` keeps this index scoped to the packages that reference it.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
# cu130 has no macOS wheels; scope it to Linux so Darwin/others resolve torch
# from PyPI (arm64 + MPS). Linux still gets 2.13.0+cu130 with sm_120 (Blackwell).
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

# uv workspace (F1: each instance is an independent build unit with its own
# pyproject). Members are package=false: they declare each instance's
# dependency contract and share one lockfile. `contracts` stays
# path-importable (contracts is vendored ADR-0006 and cannot carry a pyproject,
# so `uv sync --package` build-isolation is intentionally not used); per-instance
# slim images are produced by Dockerfile.backend/edge via dependency-groups.
[tool.uv.workspace]
members = ["backend", "worker", "shared"]

# Type-boundary enforcement (issue #308 follow-up). import-linter already gates
# dependency direction in CI; nothing gated types, so a type rule was only ever a
# comment. Scope is deliberately narrow: contracts/ is the shared edge<->Hub
# surface and shared/ sits directly behind it, so those are where an unchecked
# annotation costs the most.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["^\\.scratch/", "^\\.venv/"]

# contracts/ is the edge<->Hub surface and is already strict-clean (19 files,
# zero errors at --strict), so strict is locked in here to keep it that way.
[[tool.mypy.overrides]]
module = ["contracts.*"]
strict = true

# shared/ is strict with no exemptions. It started at 11 errors across
# edge_ingest_client, evidence_http_transport, and detection_policies; all were
# fixed rather than baselined, so there is nothing here to carve out.
[[tool.mypy.overrides]]
module = ["shared.*"]
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".scratch", ".venv"]

# Stability deny-list (docs/rules/code-stability.md, ADR):
#   B    bugbear — B904 raise-from, B006 mutable defaults
#   BLE  blind except Exception (boundary catches need `# noqa: BLE001` + reason)
#   S110/S112  try-except-pass / try-except-continue
#   TRY  tryceratops — TRY002 vanilla raise, TRY400 logging.exception in handlers
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "S110", "S112", "TRY", "TID", "FAST"]
# FAST (FastAPI rules) enabled with the backend vertical-slice; Header/Query deps
# use typing.Annotated (FAST002).
# TRY003 (no long messages outside exception class) is ignored deliberately:
# informative inline `raise ValueError(f"...")` messages ARE the explicit-refusal
# style this codebase wants; demanding a custom exception class per message
# discourages raising. All other TRY rules stay on.
ignore = ["TRY003"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: local multi-service integration tests excluded from the default CI suite.",
    "real_stack: real-stack E2E tests that require external RTSP tooling (mediamtx, ffmpeg) on PATH; deselected in CI via `-m \"not real_stack\"`, see tests/AGENTS.md for running locally.",
    "heavy: spawns a real interpreter subprocess whose exit depends on wall-clock supervision (watchdog deadlines, hard-exit paths). Correct on an idle host, flaky on a loaded CI runner because process start alone can outlast the deadline. Deselected in CI via `-m \"not heavy\"`; run locally before touching worker/runtime.",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Declarative architecture contracts (deep-interview → ralplan plan). Boundaries
# between the front/backend/edge instances + shared, and 2-depth ownership inside
# each, are enforced here via `uv run --group lint lint-imports` (also a
# pre-commit hook and CI step).
[tool.importlinter]
root_packages = ["backend", "contracts", "shared", "worker"]

[[tool.importlinter.contracts]]
name = "backend and worker are independent (worker→backend relay boundary only)"
type = "independence"
modules = ["backend", "worker"]

[[tool.importlinter.contracts]]
name = "runtime packages cannot import edge database DDL"
type = "forbidden"
source_modules = ["backend", "worker"]
forbidden_modules = ["backend.app.edge_db.migrator", "backend.app.edge_db.schema"]

[[tool.importlinter.contracts]]
name = "contracts is a leaf (imports nothing internal)"
type = "forbidden"
source_modules = ["contracts"]
forbidden_modules = ["backend", "shared.events", "backend.app.edge_db", "worker"]

[[tool.importlinter.contracts]]
# Stage 2b: 2-depth ownership inside backend — base (core/shared) must not import
# the upper feature/route/app layers (enforces the vertical-slice direction).
name = "backend base (core/shared) does not import upper layers"
type = "forbidden"
source_modules = ["backend.app.core", "backend.app.shared"]
forbidden_modules = ["backend.app.features", "backend.app.routes", "backend.app.main", "backend.app.lifespan"]

[[tool.importlinter.contracts]]
# worker/types/AGENTS.md: the bottom of the ladder — imports only the standard
# library and contracts.
name = "worker.types imports only contracts from the internal graph"
type = "forbidden"
source_modules = ["worker.types"]
forbidden_modules = ["backend", "shared", "worker.interfaces", "worker.adapters", "worker.pipeline", "worker.domains", "worker.runtime"]

[[tool.importlinter.contracts]]
# worker/interfaces/AGENTS.md: Protocol-only seam layer — imports only the
# standard library, contracts, and worker.types.
name = "worker.interfaces imports only contracts and worker.types from the internal graph"
type = "forbidden"
source_modules = ["worker.interfaces"]
forbidden_modules = ["backend", "shared", "worker.adapters", "worker.pipeline", "worker.domains", "worker.runtime"]

[[tool.importlinter.contracts]]
# worker/adapters/AGENTS.md: concrete decode/model/encode implementations never
# reach back up to a stage, a domain, or the runtime that owns them.
name = "worker adapters do not depend on pipeline, domains, or runtime"
type = "forbidden"
source_modules = ["worker.adapters"]
forbidden_modules = ["worker.pipeline", "worker.domains", "worker.runtime"]

[[tool.importlinter.contracts]]
# worker/domains/AGENTS.md: a domain never opens a stream, sends a relay
# request, writes a clip, or learns how it was scheduled.
name = "worker domains do not depend on ingest, output, or runtime"
type = "forbidden"
source_modules = ["worker.domains"]
forbidden_modules = ["worker.pipeline.ingest", "worker.pipeline.output", "worker.runtime"]

[[tool.importlinter.contracts]]
# worker/pipeline/AGENTS.md: perception stays pure numeric math, testable
# without a camera, a model, or a filesystem.
name = "worker perception features stay pure"
type = "forbidden"
source_modules = ["worker.pipeline.perception"]
forbidden_modules = ["backend", "shared.events", "worker.adapters", "worker.pipeline.bus", "worker.pipeline.ingest", "worker.pipeline.decision", "worker.pipeline.output", "worker.domains", "worker.runtime"]

[[tool.importlinter.contracts]]
# worker/runtime/AGENTS.md: runtime is the only package that may import
# everything else; nothing else may import runtime back.
name = "worker runtime is the sole composition root"
type = "forbidden"
source_modules = ["worker.types", "worker.interfaces", "worker.adapters", "worker.pipeline", "worker.domains"]
forbidden_modules = ["worker.runtime"]
