# Workspace member: backend instance (FastAPI gateway). Slim serving deps only.
[project]
name = "eldercare-backend"
version = "0.1.1"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "pydantic-settings>=2",
    "numpy>=1.26",
]

[tool.uv]
package = false
